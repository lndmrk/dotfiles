[desktop/ibus/panel/emoji]
hotkey = ['<Super>period']

[org/gnome/Ptyxis]
audible-bell = false
interface-style = 'dark'
default-profile-uuid = 'b6ff21bfd0411c7988e5244b6903c71a'
profile-uuids = ['b6ff21bfd0411c7988e5244b6903c71a']

[org/gnome/Ptyxis/Profiles/b6ff21bfd0411c7988e5244b6903c71a]
bold-is-bright = false
scrollback-lines = 100000
palette = 'modus'

[org/gnome/Ptyxis/Shortcuts]
detach-tab = '<Shift><Control>space'
move-next-tab = '<Control>Tab'
move-previous-tab = '<Shift><Control>Tab'
move-tab-left = '<Shift><Control>Left'
move-tab-right = '<Shift><Control>Right'

[org/gnome/desktop/calendar]
show-weekdate = true

[org/gnome/desktop/datetime]
automatic-timezone = true

[org/gnome/desktop/input-sources]
sources = [('xkb', 'us'), ('xkb', 'se')]
xkb-options = ['compose:ralt']

[org/gnome/desktop/interface]
clock-show-date = true
gtk-enable-primary-paste = false
gtk-theme = 'Adwaita-dark'

[org/gnome/desktop/notifications]
show-in-lock-screen = false

[org/gnome/desktop/peripherals/touchpad]
tap-to-click = true

[org/gnome/desktop/wm/keybindings]
switch-to-workspace-1 = ['<Super>Home']
switch-to-workspace-left = ['<Super><Control>Left']
switch-to-workspace-right = ['<Super><Control>Right']
switch-to-workspace-up = ['<Super><Control>Up']
switch-to-workspace-down = ['<Super><Control>Down']
switch-to-workspace-last = ['<Super>End']
switch-group = ['<Super>Above_Tab']
switch-group-backward = ['<Shift><Super>Above_Tab']
switch-applications = ['<Super><Control>Tab']
switch-applications-backward = ['<Shift><Super><Control>Tab']
switch-windows = ['<Super>Tab']
switch-windows-backward = ['<Shift><Super>Tab']
switch-panels = ['<Super><Control>Above_Tab']
switch-panels-backward = ['<Shift><Super><Control>Above_Tab']
cycle-group = ['<Super>F6']
cycle-group-backward = ['<Shift><Super>F6']
cycle-windows = ['<Super>Escape']
cycle-windows-backward = ['<Shift><Super>Escape']
cycle-panels = @as []
cycle-panels-backward = @as []
panel-run-dialog = ['<Super>x']
activate-window-menu = @as []
toggle-maximized = @as []
maximize = ['<Super>Up']
unmaximize = ['<Super>Down']
minimize = @as []
close = ['<Super>F4']
begin-move = @as []
begin-resize = @as []
move-to-workspace-1 = ['<Super><Control><Shift>Home']
move-to-workspace-last = ['<Super><Control><Shift>End']
move-to-workspace-left = ['<Super><Control><Shift>Left']
move-to-workspace-right = ['<Super><Control><Shift>Right']
move-to-workspace-up = ['<Super><Control><Shift>Up']
move-to-workspace-down = ['<Super><Control><Shift>Down']
move-to-monitor-left = ['<Super><Shift>Left']
move-to-monitor-right = ['<Super><Shift>Right']
move-to-monitor-up = ['<Super><Shift>Up']
move-to-monitor-down = ['<Super><Shift>Down']
switch-input-source = ['<Super>space', 'XF86Keyboard']
switch-input-source-backward = ['<Shift><Super>space', '<Shift>XF86Keyboard']

[org/gnome/desktop/wm/preferences]
audible-bell = false

[org/gnome/mutter]
workspaces-only-on-primary = false

[org/gnome/settings-daemon/plugins/color]
night-light-enabled = true

[org/gnome/settings-daemon/plugins/media-keys]
calculator = ['<Super>c']
home = ['<Super>d']
logout = ['<Super>Delete']
screenreader = @as []
www = ['<Super>b']
custom-keybindings = ['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
name = 'Terminal'
binding = '<Super>Return'
command = 'ptyxis --new-window'

[org/gnome/settings-daemon/plugins/power]
sleep-inactive-battery-timeout = 900
sleep-inactive-battery-type = 'suspend'

[org/gnome/shell]
favorite-apps = @as []

[org/gnome/shell/app-switcher]
current-workspace-only = true

[org/gnome/shell/keybindings]
show-screen-recording-ui = @as []

[org/gnome/system/locale]
region = 'sv_SE.UTF-8'

[org/gnome/system/location]
enabled = true
max-accuracy-level = 'city'
